services:
  db:
    image: mysql:8.1.0
    restart: always
    volumes:
      - mysql_volume:/var/lib/mysql
    ports:
      - "3306:3306"
    env_file: mysql.env
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: comi:1.0-beta
    restart: always
    volumes:
      - media_volume:/code/media
    ports:
      - "8080:8000"
    env_file: mysql.env
    environment:
      - DATABASE_HOST=db
      - MYSQL_PORT=3306
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_volume:
  media_volume: