{% load i18n %}
{% comment %}One medal of a profile (`card`: an AchievementCard) and its detail card. Everything
here is escaped by the template engine; the script only moves the <template> content into the
popover. A secret not earned yet shows nothing but "???" and its hint.{% endcomment %}
{% if card.concealed %}
  {% if card.achievement.hint %}
    {% blocktranslate trimmed with hint=card.achievement.hint asvar label %}Secret achievement. Hint: {{ hint }}{% endblocktranslate %}
  {% else %}
    {% translate "Secret achievement." as label %}
  {% endif %}
{% elif card.earned %}
  {% if card.tiered %}
    {% blocktranslate trimmed with name=card.achievement.name level=card.level max=card.max_level date=card.awarded_at|date:"DATE_FORMAT" asvar label %}
      {{ name }}, level {{ level }} of {{ max }}. Earned on {{ date }}
    {% endblocktranslate %}
  {% else %}
    {% blocktranslate trimmed with name=card.achievement.name date=card.awarded_at|date:"DATE_FORMAT" asvar label %}
      {{ name }}. Earned on {{ date }}
    {% endblocktranslate %}
  {% endif %}
{% elif card.goal %}
  {% blocktranslate trimmed with name=card.achievement.name progress=card.progress goal=card.goal asvar label %}
    {{ name }}, not earned yet. Progress: {{ progress }} of {{ goal }}
  {% endblocktranslate %}
{% else %}
  {% blocktranslate trimmed with name=card.achievement.name asvar label %}{{ name }}, not earned yet.{% endblocktranslate %}
{% endif %}
<button type="button" class="medal-btn" aria-label="{{ label }}" data-achievement-detail="achievement-detail-{{ card.achievement.pk }}">
  {% include 'includes/achievement_medal.html' with medal=card.medal %}
</button>
<template id="achievement-detail-{{ card.achievement.pk }}">
  {% if card.concealed %}
    <div class="medal-popover__name">???</div>
    <div class="medal-popover__desc">{% if card.achievement.hint %}{{ card.achievement.hint }}{% else %}{% translate "Secret achievement." %}{% endif %}</div>
  {% else %}
    <div class="medal-popover__name">{{ card.achievement.name }}</div>
    {% if card.achievement.description %}<div class="medal-popover__desc">{{ card.achievement.description }}</div>{% endif %}
    <div class="medal-popover__meta">
      <span>{{ card.achievement.get_category_display }}</span>
      {% if card.earned and card.tiered and card.tier %}
        <span>{% blocktranslate trimmed with level=card.level max=card.max_level rim=card.medal.rim.label measure=card.measure threshold=card.tier.threshold %}
          Level {{ level }} of {{ max }} · {{ rim }} ({{ measure }}: {{ threshold }})
        {% endblocktranslate %}</span>
        {% if card.tier.label %}<span>{{ card.tier.label }}</span>{% endif %}
      {% endif %}
      {% if card.earned and card.next_threshold %}
        <span>{% blocktranslate with threshold=card.next_threshold %}Next level at {{ threshold }}{% endblocktranslate %}</span>
      {% endif %}
      {% if card.earned %}
        <span>{% blocktranslate with date=card.awarded_at|date:"DATE_FORMAT" %}Earned on {{ date }}{% endblocktranslate %}</span>
      {% endif %}
      {% if card.goal %}
        <span>{% blocktranslate with progress=card.progress goal=card.goal %}Progress: {{ progress }} / {{ goal }}{% endblocktranslate %}</span>
      {% endif %}
    </div>
    {% if card.goal %}
      <div class="medal-popover__bar" role="progressbar" aria-valuenow="{{ card.progress }}" aria-valuemin="0" aria-valuemax="{{ card.goal }}" aria-label="{% translate 'Progress' %}">
        <span style="width: {{ card.percent }}%"></span>
      </div>
    {% endif %}
  {% endif %}
</template>
