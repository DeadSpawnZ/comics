{% load i18n %}
<div class="md-chip-set" role="group" aria-label="{% translate 'Filter by letter' %}">
  <a
    href="{% querystring letter='' page=None %}"
    class="md-chip {% if not selected_letter %}is-selected{% endif %}"
    {% if not selected_letter %}aria-current="true"{% endif %}
  >
    {% if not selected_letter %}<span class="material-symbols-outlined" aria-hidden="true">check</span>{% endif %}
    {% translate "All" context "letters" %}
  </a>
  {% for letter in alphabet %}
  <a
    href="{% querystring letter=letter page=None %}"
    class="md-chip {% if letter == selected_letter %}is-selected{% endif %}"
    {% if letter == selected_letter %}aria-current="true"{% endif %}
  >
    {% if letter == selected_letter %}<span class="material-symbols-outlined" aria-hidden="true">check</span>{% endif %}
    {{ letter }}
  </a>
  {% endfor %}
</div>
